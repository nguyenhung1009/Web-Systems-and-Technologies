<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bài 5</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <h2>Email đơn giản</h2>

    <input type="text" id="txt" placeholder="Nhập email">
    <button id="btn">Kiểm tra</button>
    <p id="result"></p>

    <script>
        $(document).ready(function() {
            let pattern = /^[^\s@]+@[^\s@.]+(?:\.[^\s@.]+)+$/;

            $("#btn").on("click", function() {
                let chuoi = $("#txt").val();

                if (pattern.test(chuoi)) {
                    $("#result").text("ĐÚNG pattern").css("color", "green");
                } else {
                    $("#result").text("SAI pattern").css("color", "red");
                }
            });
        });
    </script>
</body>

</html>
