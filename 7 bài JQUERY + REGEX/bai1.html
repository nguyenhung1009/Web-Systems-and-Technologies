<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bài 1</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <h2>Chỉ gồm chữ số</h2>

    <input type="text" id="txt" placeholder="Nhập chuỗi">
    <button id="btn">Kiểm tra</button>
    <p id="result"></p>

    <script>
        $(document).ready(function() {
            let pattern = /^\d+$/;

            $("#btn").on("click", function() {
                let chuoi = $("#txt").val();

                if (pattern.test(chuoi)) {
                    $("#result").text("ĐÚNG pattern").css("color", "green");
                } else {
                    $("#result").text("SAI pattern").css("color", "red");
                }
            });
        });
    </script>
</body>

</html>
