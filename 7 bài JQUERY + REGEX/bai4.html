<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bài 4</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <h2>Số điện thoại</h2>
    <p>Gồm đúng 10 chữ số và bắt đầu bằng số 0.</p>

    <input type="text" id="txt" placeholder="Nhập số điện thoại">
    <button id="btn">Kiểm tra</button>
    <p id="result"></p>

    <script>
        $(document).ready(function() {
            let pattern = /^0\d{9}$/;

            $("#btn").on("click", function() {
                let chuoi = $("#txt").val();

                if (pattern.test(chuoi)) {
                    $("#result").text("ĐÚNG pattern").css("color", "green");
                } else {
                    $("#result").text("SAI pattern").css("color", "red");
                }
            });
        });
    </script>
</body>

</html>
