<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bài 3</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <h2>Tên đăng nhập</h2>
    <p>Dài từ 5 đến 15 ký tự, gồm chữ thường, chữ số và dấu _.</p>

    <input type="text" id="txt" placeholder="Nhập tên đăng nhập">
    <button id="btn">Kiểm tra</button>
    <p id="result"></p>

    <script>
        $(document).ready(function() {
            let pattern = /^[a-z0-9_]{5,15}$/;

            $("#btn").on("click", function() {
                let chuoi = $("#txt").val();

                if (pattern.test(chuoi)) {
                    $("#result").text("ĐÚNG pattern").css("color", "green");
                } else {
                    $("#result").text("SAI pattern").css("color", "red");
                }
            });
        });
    </script>
</body>

</html>
