<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 7</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h2>Kiểm tra ngày sinh</h2>
    <label>Ngày sinh:</label>
    <input type="text" id="ngay">
    <p id="kq"></p>

    <script>
    $(document).ready(function() {
        $("#ngay").on("input", function() {
            let s = $(this).val().replace(/\D/g, "").slice(0, 8);

            if (s.length > 4) s = s.slice(0, 2) + "/" + s.slice(2, 4) + "/" + s.slice(4);
            else if (s.length > 2) s = s.slice(0, 2) + "/" + s.slice(2);

            $(this).val(s);
            if (s.length == 10) {
                let m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s);
                let d = new Date(+m[3], +m[2] - 1, +m[1]);
                let ok = m && d.getDate() == +m[1] && d.getMonth() == +m[2] - 1 && d.getFullYear() == +m[3];
                $("#kq").text(ok ? "Ngày hợp lệ" : "Ngày không tồn tại");
            } else {
                $("#kq").text("");
            }
        });
    });
    </script>
</body>
</html>
